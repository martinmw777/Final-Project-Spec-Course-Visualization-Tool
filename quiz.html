<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACC Major Quiz</title>
  <!-- bootstrap used for navbar, grid layout, form controls, and buttons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- styles.css compiled from scss using variables and custom theme -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="images/favicon.ico">
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"><span class="brand-mark">ACC</span> Course Visualization Tool</a>
       <!-- hamburger menu for mobile navigation -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Programs</a></li>
            <li class="nav-item"><a class="nav-link active" href="quiz.html">Major Quiz</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#programs">Course Cards</a></li>
            <li class="nav-item"><a class="nav-link external-link" href="https://polytechnic.purdue.edu/academic-areas/acc#undergraduate" target="_blank" rel="noopener">Purdue ACC</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="quiz-hero">
      <div class="container">
        <p class="eyebrow">Interest Finder</p>
        <h1>Find the program meant for YOU.</h1>
        <p class="lead">Answer 10 quick questions, and we'll make a recommendation based on your interests!</p>
      </div>
    </section>

    <section class="container py-5">
      <!-- form uses labels, required fields, and aria-label for accessibility -->
      <form id="majorQuiz" class="quiz-card" aria-label="ACC major recommendation quiz">
        <!-- bootstrap grid ensures responsive layout across screen sizes -->
        <div class="row g-4">
          <div class="col-md-6"><label for="q1" class="form-label">1. Which activity sounds most interesting?</label><select id="q1" class="form-select" required><option value="">Choose one</option><option value="cyber">Protecting systems from hackers</option><option value="web">Building websites</option><option value="game">Creating video games</option><option value="data">Analyzing data</option></select></div>
          <div class="col-md-6"><label for="q2" class="form-label">2. What kind of work environment sounds best?</label><select id="q2" class="form-select" required><option value="">Choose one</option><option value="network">Server rooms and network labs</option><option value="ux">Design studios and user research spaces</option><option value="animation">Animation and production studios</option><option value="cit">General IT departments</option></select></div>
          <div class="col-md-6"><label for="q3" class="form-label">3. What do you enjoy solving most?</label><select id="q3" class="form-select" required><option value="">Choose one</option><option value="data">Patterns in large sets of information</option><option value="cyber">Security risks and vulnerabilities</option><option value="web">How to make web apps work better</option><option value="themed">How to create immersive experiences</option></select></div>
          <div class="col-md-6"><label for="q4" class="form-label">4. Which class topic sounds most exciting?</label><select id="q4" class="form-select" required><option value="">Choose one</option><option value="network">Networking and infrastructure</option><option value="game">Game design and simulation</option><option value="ux">Human-centered design</option><option value="animation">Visual effects and motion graphics</option></select></div>
          <div class="col-md-6"><label for="q5" class="form-label">5. Which career sounds most appealing?</label><select id="q5" class="form-select" required><option value="">Choose one</option><option value="cyber">Cybersecurity analyst</option><option value="web">Web developer</option><option value="data">Data analyst</option><option value="cit">IT support specialist</option></select></div>
          <div class="col-md-6"><label for="q6" class="form-label">6. Do you prefer creative or technical work?</label><select id="q6" class="form-select" required><option value="">Choose one</option><option value="animation">Mostly creative visual work</option><option value="network">Mostly technical infrastructure work</option><option value="ux">A mix of research and design</option><option value="web">A mix of coding and design</option></select></div>
          <div class="col-md-6"><label for="q7" class="form-label">7. Which project would you rather complete?</label><select id="q7" class="form-select" required><option value="">Choose one</option><option value="game">Build a playable game demo</option><option value="data">Create a dashboard from data</option><option value="cyber">Investigate a security incident</option><option value="themed">Design an interactive attraction concept</option></select></div>
          <div class="col-md-6"><label for="q8" class="form-label">8. What technology interests you most?</label><select id="q8" class="form-select" required><option value="">Choose one</option><option value="network">Cloud systems and networks</option><option value="animation">3D graphics and rendering</option><option value="ux">Prototyping and usability testing</option><option value="cit">Databases and information systems</option></select></div>
          <div class="col-md-6"><label for="q9" class="form-label">9. Which problem would you want to fix?</label><select id="q9" class="form-select" required><option value="">Choose one</option><option value="web">A website that is hard to use</option><option value="cyber">A weak password policy</option><option value="network">A slow network connection</option><option value="data">A company that cannot understand its data</option></select></div>
          <div class="col-md-6"><label for="q10" class="form-label">10. What final project would you choose?</label><select id="q10" class="form-select" required><option value="">Choose one</option><option value="web">A full website with interactive pages</option><option value="game">A game or simulation</option><option value="themed">A themed experience or museum exhibit</option><option value="cit">An IT system plan for a business</option></select></div>
        </div>
        <button type="submit" class="btn btn-gold btn-lg mt-4">Get Recommendation</button>
      </form>

      <!-- aria-live gives quiz results to screen readers -->
      <section id="resultBox" class="result-panel d-none" role="status" aria-live="polite">
        <p class="eyebrow dark">Recommended Major</p>
        <h2 id="resultText" class="h3 mb-0"></h2>
      </section>
    </section>
  </main>

  <footer class="site-footer text-center py-4">
    <div class="container">
      <p class="mb-1">ACC Course Visualization Tool © 2026</p>
    </div>
  </footer>

  <!-- quiz logic handled in quiz.js to separate behavior from structure -->
  <script src="js/quiz.js"></script>
  <!-- bootstrap javascript enables navbar collapse and other interactive components -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
